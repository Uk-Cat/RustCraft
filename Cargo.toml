[package]
name = "leafish"
version = "0.1.0"
authors = [ "Thinkofdeath <thinkofdeath@spigotmc.org>", "iceiix <ice_ix@protonmail.ch>", "terrarier2111" ]
edition = "2018"
resolver = "2"
description = "Multi-protocol multi-platform Minecraft-compatible client"
repository = "https://github.com/Lea-fish/Leafish"
license = "MIT/Apache-2.0"

[package.metadata.bundle]
name = "Leafish"
identifier = "com.github.Lea-fish.Leafish"
icon = ["resources/icon*.png"]
category = "Game"
osx_minimum_system_version = "10.14"

[profile.dev]
split-debuginfo = "unpacked"
# Steven runs horrendously slow with no optimizations, and often freezes.
# However, building with full -O3 optimizations takes too long for a debug build.
# Use an -O1 optimization level strikes a good compromise between build and program performance.
opt-level = 1

# Lighter release-like profile used for the Windows cross-build, where the
# build host has limited RAM (~4 GB) and the default `release` profile
# (opt-level=3) causes rustc to be OOM-killed. opt-level=1 keeps peak
# rustc memory usage low enough to fit, at the cost of some runtime
# performance. Stripped to keep the .exe small for download.
[profile.winrelease]
inherits = "release"
opt-level = 1
debug = false
strip = true
codegen-units = 16
lto = false

# leafish_blocks is a 95k-line auto-generated crate. Compiling it at
# opt-level>=1 makes rustc use too much RAM and gets OOM-killed on this
# host (4 GB cgroup limit). Force opt-level=0 with maximum codegen-units
# (256) so each codegen unit is small and peak memory stays low enough
# to fit. The runtime cost is negligible because block registry lookups
# are not hot-path code.
[profile.release.package.leafish_blocks]
opt-level = 0
codegen-units = 256

[dependencies]
winit = { version = "0.29", features = ["rwh_05", "serde"] }
raw-window-handle = "0.5.0"
glow = "0.13"
byteorder = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = { version = "1.0", features = ["rust_backend"], default-features = false }
zip = { version = "0.6", features = ["deflate"], default-features = false }
image = "0.25"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
rand_pcg = "0.3"
base64 = "0.22"
log = { version = "0.4", features = ["std"] }
cgmath = "0.17"
lazy_static = "1.4" # TODO: get rid of this and use OnceCell instead
collision = "0.20"
rsa_public_encrypt_pkcs1 = "0.4"
structopt = "0.3"
copypasta = "0.10"
instant = "0.1"
dirs = "5.0"

# Concurrency features
dashmap = "5.5"
parking_lot = "0.12"
atomic_float = "0.1.0"
# arc-swap = "1.4.0" # TODO: Use this!
crossbeam-channel = "0.5" # check if flume would be better in terms of performance!
# flume = "0.10.8" # replaced by crossbeam channel
# tokio = { version = "0.2", features = ["full"] } # readd as soon as we want to impl this!
rayon = "1.5"
rfd = "0.14"
bevy_ecs = "0.13"

reqwest = { version = "0.11", features = [ "blocking" ]}
# glutin = "0.29"
glutin = "0.31"
glutin-winit = "0.4"

arc-swap = "1.7.0"
# phf = "0.11"

[dependencies.leafish_resources]
path = "./resources"
version = "0"

[dependencies.leafish_blocks]
path = "./blocks"
version = "0"

[dependencies.leafish_shared]
path = "./shared"
version = "0"

[dependencies.leafish_protocol]
path = "./protocol"
version = "0"

# ---------------------------------------------------------------------------
# Feature flags
# ---------------------------------------------------------------------------
#
# `veh` — Windows Vectored Exception Handler for SEH crash diagnostics.
# OFF by default. When enabled, the binary calls
# `AddVectoredExceptionHandler` at startup to capture Windows SEH
# exceptions (stack overflow, access violation, etc.) and write a
# `crash-veh-<timestamp>.log` file with the exception code, address,
# thread id, and backtrace.
#
# WHY THIS IS OFF BY DEFAULT
# --------------------------
# `AddVectoredExceptionHandler` + raw `extern "system"` FFI +
# `SetThreadStackGuarantee` + reading `EXCEPTION_RECORD` fields via
# pointer dereference is the exact code pattern that Windows
# Defender's ML heuristics flag as "Trojan:Win32/Wacatac.B!ml" or
# "HackTool:Win32/...". The VEH technique is legitimately used by
# malware (anti-debugging, packers, code injection) and by debuggers
# / crash reporters — Defender can't tell the difference, so it
# flags any unsigned binary that does this.
#
# For the default portable .zip distribution we want the .exe to
# run cleanly on a stock Windows install without Defender quarantine,
# so VEH is OFF. Users who want SEH crash diagnostics (i.e. anyone
# investigating the JoinGame crash) build with `--features veh` and
# add a Defender exclusion for the resulting .exe themselves.
#
# The Rust panic hook in `console.rs` (which catches Rust panics,
# including most `unwrap()` failures) is NOT feature-gated — it
# uses only standard Rust APIs (`std::panic::set_hook`,
# `Backtrace::force_capture`) and doesn't trigger Defender.
[features]
default = []
veh = []

# NOTE: src/veh.rs uses raw `extern "system"` FFI declarations instead
# of the `windows-sys` crate. This avoids coupling our build to whatever
# `windows-sys` version our transitive deps (winit, glutin, …) resolve
# to — the windows-sys API surface has been reorganised several times
# (EXCEPTION_RECORD moved between modules, AddVectoredExceptionHandler
# disappeared from some feature combinations, etc.) and we don't want
# to track that. The Windows ABI itself is stable, so direct FFI is
# safe.
